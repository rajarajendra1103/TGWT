# Baseline Standard Transformer Configuration for Colab T4 (Parameter-Matched)

model:
  type: "baseline"
  vocab_size: 50257
  max_seq_len: 4096
  d_model: 512
  n_heads: 8
  n_layers: 4
  d_ff: 2048
  dropout: 0.1
  tie_weights: true

training:
  batch_size: 4
  seq_len: 1024
  learning_rate: 3.0e-4
  min_lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  max_steps: 5000
  gradient_accumulation_steps: 2
  mixed_precision: "fp16"
  seed: 42
  eval_interval: 250
  save_interval: 1000
  log_interval: 50
  output_dir: "./checkpoints_baseline"

data:
  dataset_name: "wikitext-103"
  cache_dir: "./data_cache"
